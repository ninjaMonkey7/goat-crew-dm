<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goat Crew — DM screen</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f5f1" media="(prefers-color-scheme: light)">
<script>
/* Theme, before first paint: localStorage gc_theme = system | light | dark → <html data-theme="light|dark">.
   On System it follows the OS live. Buttons with data-theme-set="…" and #theme-toggle drive it (see dm.css). */
(function () {
  var KEY = 'gc_theme', root = document.documentElement, mem = 'system', timer;
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null, BAR = { dark: '#121214', light: '#f7f5f1' };
  function pref() { var v; try { v = localStorage.getItem(KEY); } catch (_) { v = mem; } return v === 'light' || v === 'dark' ? v : 'system'; }
  function resolve(p) { return p === 'system' ? (mq && !mq.matches ? 'light' : 'dark') : p; }
  function sync() {
    var p = pref(), next = root.dataset.theme === 'dark' ? 'light' : 'dark', tg = document.getElementById('theme-toggle');
    document.querySelectorAll('[data-theme-set]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.themeSet === p)); });
    if (tg) { tg.title = 'Switch to ' + next + ' theme'; tg.setAttribute('aria-label', tg.title); }
  }
  function apply(fade) {
    var t = resolve(pref());
    if (fade && root.dataset.theme !== t) { root.classList.add('theme-fade'); clearTimeout(timer); timer = setTimeout(function () { root.classList.remove('theme-fade'); }, 400); }
    root.dataset.theme = t;
    document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = BAR[t]; });
    sync();
  }
  function set(p) { mem = p; try { localStorage.setItem(KEY, p); } catch (_) { /* private mode: keep it for this page */ } apply(true); }
  function onSystem() { if (pref() === 'system') apply(true); }
  window.gcTheme = { pref: pref, set: set, sync: sync, current: function () { return root.dataset.theme; } };
  apply(false);
  if (mq) { if (mq.addEventListener) mq.addEventListener('change', onSystem); else if (mq.addListener) mq.addListener(onSystem); }
  addEventListener('storage', function (e) { if (e.key === KEY) apply(true); });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-theme-set], #theme-toggle'); if (!b) return;
    set(b.id === 'theme-toggle' ? (root.dataset.theme === 'dark' ? 'light' : 'dark') : b.dataset.themeSet);
  });
  document.addEventListener('DOMContentLoaded', sync);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dm.css">
<link rel="stylesheet" href="battlemap.css">
<link rel="stylesheet" href="admin.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐐</text></svg>">
</head>
<body>
<div id="app">
  <!-- Login: a GitHub token is the key to the private data repo; then say which DM you are -->
  <div id="login" class="hidden">
    <div class="login-box">
      <h1>🐐 The Goat Crew</h1>
      <p class="muted">DM screen — Kingdom of Mathar</p>
      <div id="login-direct">
        <label>GitHub token <span class="muted">(fine-grained · Contents: read &amp; write on the data repo)</span></label>
        <input id="login-token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
      </div>
      <label>Who are you?</label>
      <select id="login-user"><option value="">— paste your token first —</option></select>
      <div id="login-worker" class="hidden">
        <label>Password</label>
        <input id="login-pass" type="password" autocomplete="current-password" placeholder="Your password">
      </div>
      <button id="login-btn" class="btn primary">Enter the Grumpy Goat</button>
      <p id="login-err" class="err"></p>
      <p id="login-mode" class="muted" style="font-size:12px;margin:0"></p>
      <details class="collapse"><summary class="muted" style="font-size:13px;font-weight:400">Connection settings</summary>
        <label class="muted" style="font-size:12px">Login server (leave empty to use a GitHub token in this browser)</label>
        <input id="login-worker-url" placeholder="https://goat-crew-dm.….workers.dev" spellcheck="false">
        <label class="muted" style="font-size:12px">Data repo</label>
        <div class="row"><input id="login-owner" placeholder="owner" style="flex:1;min-width:0"><input id="login-repo" placeholder="repo" style="flex:1;min-width:0"><input id="login-branch" placeholder="branch" style="width:90px"></div>
        <p class="muted" style="font-size:12px;margin:6px 0 0">Settings are stored only in this browser.</p>
      </details>
    </div>
  </div>

  <!-- Sign-in link from an admin: choose your own password -->
  <div id="invite" class="hidden">
    <div class="login-box invite-box">
      <div class="invite-mark">🐐</div>
      <h1 id="invite-title">Checking your link…</h1>
      <p id="invite-lead" class="muted"></p>
      <div id="invite-form" class="hidden">
        <p class="invite-role-row muted">Joining as <span id="invite-role" class="role-pill"></span></p>
        <label for="invite-pass">New password</label>
        <input id="invite-pass" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
        <label for="invite-pass2">Type it again</label>
        <input id="invite-pass2" type="password" autocomplete="new-password" minlength="8">
        <button id="invite-btn" class="btn primary">Set password and sign in</button>
      </div>
      <p id="invite-err" class="err"></p>
      <button id="invite-back" class="btn ghost small">Go to the normal sign-in</button>
    </div>
  </div>

  <!-- Main: sidebar (nav#tabs, grouped) + top bar (header) + content + optional pinned panel (#rail).
       Under 900px the sidebar is a drawer opened from the top bar. Element ids here are used by app.js, gh.js and battlemap.js. -->
  <div id="main" class="hidden">
    <header>
      <button id="nav-toggle" class="tb-btn tb-icon" type="button" aria-controls="tabs" aria-label="Collapse sidebar"><span class="ic-slot when-wide" data-ic="sidebar"></span><span class="ic-slot when-narrow" data-ic="navmenu"></span></button>
      <div class="tb-title" id="tb-title"></div>
      <div class="tb-right">
        <div class="tb-menu-wrap">
          <button id="pin-btn" class="tb-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="pin-menu"><span class="ic-slot" data-ic="panelright"></span><span class="tb-lbl" id="pin-lbl">Pin panel</span><span class="ic-slot tb-chev" data-ic="chev"></span></button>
          <div id="pin-menu" class="pop" role="menu" aria-label="Pin a panel" hidden></div>
          <select id="pin-pick" class="sr-only" tabindex="-1" aria-hidden="true" title="Pin a panel to the right of whatever tab you're on">
            <option value="">Pin a panel…</option>
            <option value="chat">DM Chat</option>
            <option value="notes">My Notes</option>
            <option value="battle">Initiative</option>
            <option value="dice">Dice</option>
            <option value="party">Party</option>
            <option value="map">World map</option>
          </select>
        </div>
        <button id="sync" class="sync" type="button" data-state="wait" aria-label="Connecting"><span id="live-dot" aria-hidden="true"></span><span class="sync-lbl" id="sync-lbl">Connecting…</span></button>
        <div class="tb-menu-wrap">
          <button id="acct-btn" class="tb-btn acct-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="acct-menu" aria-label="Account"><span class="acct-av" aria-hidden="true"></span><span class="tb-lbl acct-name" id="acct-name"></span><span class="ic-slot tb-chev" data-ic="chev"></span></button>
          <div id="acct-menu" class="pop pop-right" role="menu" aria-label="Account" hidden>
            <div class="acct-head"><span class="acct-av lg" aria-hidden="true"></span><span id="whoami"></span></div>
            <div class="pop-sep" role="separator"></div>
            <button id="theme-toggle" class="pop-item" type="button" role="menuitem" data-keep title="Switch theme" aria-label="Switch theme"><svg class="ic ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg><svg class="ic ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span>Dark theme</span><span class="switch" aria-hidden="true"></span></button>
            <button id="acct-settings" class="pop-item" type="button" role="menuitem"><span class="ic-slot" data-ic="settings"></span><span>Settings</span></button>
            <div class="pop-sep" role="separator"></div>
            <button id="logout" class="pop-item" type="button" role="menuitem"><span class="ic-slot" data-ic="logout"></span><span>Log out</span></button>
          </div>
        </div>
      </div>
    </header>
    <nav id="tabs" aria-label="Sections">
      <div class="nav-head"><span class="brand"><span class="brand-mark" aria-hidden="true">🐐</span><span class="brand-name">Goat Crew</span></span></div>
      <div class="nav-body">
        <div class="nav-group" data-group="play" role="group" aria-labelledby="ng-play">
          <div class="nav-label" id="ng-play"><span>Play</span></div>
          <button data-tab="map" class="tab">World map</button>
          <button data-tab="party" class="tab">Party</button>
          <button data-tab="dice" class="tab">Dice</button>
        </div>
        <!-- one encounter, two views: the turn order and the map of the fight (the top bar switches between them) -->
        <div class="nav-group" data-group="encounter" role="group" aria-labelledby="ng-encounter">
          <div class="nav-label" id="ng-encounter"><span>Encounter</span></div>
          <button data-tab="battle" class="tab">Initiative</button>
          <button data-tab="battlemap" class="tab">Battle map</button>
        </div>
        <div class="nav-group" data-group="story" role="group" aria-labelledby="ng-story">
          <div class="nav-label" id="ng-story"><span>Story</span></div>
          <button data-tab="journal" class="tab">Journal</button>
          <button data-tab="codex" class="tab">Codex</button>
          <button data-tab="quests" class="tab">Quests</button>
          <button data-tab="board" class="tab">Board</button>
          <button data-tab="notes" class="tab">My Notes</button>
        </div>
        <div class="nav-group" data-group="dm" role="group" aria-labelledby="ng-dm">
          <div class="nav-label" id="ng-dm"><span>DM only</span><span class="nav-hint" data-tip="Hidden from players"><span class="ic-slot" data-ic="eyeoff"></span><span class="sr-only">, hidden from players</span></span></div>
          <button data-tab="chat" class="tab">DM Chat</button>
          <button data-tab="arc" class="tab dm-only hidden">Arc</button>
          <button data-tab="dm" class="tab dm-only hidden" title="Encounter builder, session prep, users and the activity log">Prep &amp; tools</button>
        </div>
        <div class="nav-group" data-group="admin" role="group" aria-labelledby="ng-admin">
          <div class="nav-label" id="ng-admin"><span>Admin</span></div>
          <button data-tab="admin" class="tab admin-only hidden">People &amp; access</button>
        </div>
      </div>
      <div class="nav-foot">
        <button data-tab="settings" class="tab">Settings</button>
      </div>
    </nav>
    <div id="nav-scrim" hidden></div>
    <main id="content"></main>
    <aside id="rail" class="hidden"></aside>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="config.js"></script>
<script src="gh.js"></script>
<script src="icons.js"></script>
<script src="bestiary.js"></script>
<script src="map.js"></script>
<script src="battle-scene.js"></script>
<script src="battlemap.js"></script>
<script src="chat.js"></script>
<script src="admin.js"></script>
<script src="app.js"></script>
</body>
</html>
